[project]
name = "x-reader"
version = "0.1.0"
description = "Fetch X/Twitter accounts and persist the raw results for later processing"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
