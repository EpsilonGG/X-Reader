name: Fetch X data — Galgame edition

# 2026-10-29 起日报一天出两份，抓取也拆成两个 workflow：
#
#   update.yml          accounts.yaml           → data/items           （声优版：声优 + 音声社团）
#   update-galgame.yml  accounts.galgame.yaml   → data-galgame/items   （Galgame 版：制造商 + 信息号）
#
# 为什么必须拆：
#   * 容量。声优版加进 109 个社团后是 237 个账号，塞进同一个 20 分钟的 job
#     只会每天红一次；拆开之后两边各自 12–27 分钟，互不阻塞。
#   * 数据。两个 workflow 各自 `git add` 并 push，共用一份 data/ 会在 rebase 时打架。
#     这里用 `config/config.galgame.yaml` 把 data_dir 指到 data-galgame。
#
# 这个 workflow 只抓 X：RSS 与 YouTube 是声优版的输入，Galgame 版用不上。
#
# 名单正本在站点仓库 `src/config/daily-roster-galgame.json`，生成本文件用的
# `accounts.galgame.yaml` 靠：
#
#   python scripts/sync_xreader_accounts.py --out ../X-Reader/accounts.yaml \
#          --galgame-out ../X-Reader/accounts.galgame.yaml
on:
  workflow_dispatch:
    inputs:
      account:
        description: "Only fetch this X account (blank = all enabled accounts)"
        required: false
        default: ""
      limit:
        description: "Max tweets per X account for this run"
        required: false
        default: ""
  schedule:
    # 与 update.yml 同样的两个时点（03:00 / 15:00 UTC），各自独立跑：
    #   03:00 UTC = 12:00 JST — JST 一天的前半段
    #   15:00 UTC = 00:00 JST — JST 这一天刚闭合，出稿等的是这一趟
    # 错开 10 分钟，避免两个 job 同时打同一批 nitter 实例。
    - cron: "10 3,15 * * *"

permissions:
  contents: write

# 与 update.yml 用**不同的** group：两个 workflow 不该互相取消，
# 但同一个 workflow 的两次运行仍然串行。
concurrency:
  group: x-reader-fetch-galgame
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 177 个账号按实测 3.9 s/账号约 11.5 分钟，留一倍余量。
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Fetch and store
        id: fetch
        continue-on-error: true
        run: |
          set -o pipefail
          args=(--json --config config/config.galgame.yaml --accounts accounts.galgame.yaml --no-rss --no-youtube)
          if [ -n "${{ inputs.account }}" ]; then
            args+=(--account "${{ inputs.account }}")
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            args+=(--limit "${{ inputs.limit }}")
          fi
          python main.py "${args[@]}" | tee report.json

      - name: Verify what was stored
        if: always()
        # 必须显式指 data-galgame：脚本默认读 data/，那是声优版的库。
        run: python scripts/verify_storage.py --data-dir data-galgame

      - name: Summarise the run
        if: always()
        run: |
          {
            echo "## X-Reader fetch (galgame edition)"
            echo
            echo '```json'
            cat report.json 2>/dev/null || echo "no report produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f report.json ]; then
            failed=$(python -c "import json; d=json.load(open('report.json')); print(' '.join(f\"{o['kind']}:{o['account']}\" for o in d['outcomes'] if o['status']=='error'))")
            if [ -n "$failed" ]; then
              echo "::warning::units failed this run: $failed"
            fi
          fi

      - name: Commit updated data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只提交自己那一份库：data-galgame/。data/ 是声优版的，别碰。
          git add data-galgame
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "chore(data): update galgame X data store"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: x-reader-galgame-diagnostics
          path: |
            report.json
            data-galgame/raw
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if the run produced nothing
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::every attempted unit failed; see the summary above"
          exit 1
